<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ordre de mission</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <h1>Ordres de mission</h1>

        <div class="card">
          <h2>Mission</h2>
          <label>Nom du document
            <input id="documentName" value="Ordre-mission-001" />
          </label>
          <label>Numéro mission
            <input id="missionNumber" value="OM-2026-001" />
          </label>
          <label>Client
            <input id="clientName" value="BC Kent Transport" />
          </label>
          <label>Contact
            <input id="contactName" value="M. Dubois" />
          </label>
          <label>Téléphone contact
            <input id="contactPhone" value="0600000000" />
          </label>
          <label>Nom entreprise
            <input id="companyName" value="BC Kent" />
          </label>
          <label>Adresse entreprise
            <input id="companyAddress" value="10 Avenue de la Mission, Lille" />
          </label>
          <label>Date mission
            <input id="missionDate" type="date" value="2026-08-30" />
          </label>
        </div>

        <div class="card">
          <h2>Chauffeur & véhicule</h2>
          <label>Chauffeur
            <select id="driverSelect"></select>
          </label>
          <label>Véhicule
            <select id="vehicleSelect"></select>
          </label>
        </div>

        <div class="card">
          <h2>Trajets</h2>
          <div id="missionLines"></div>
          <button id="addLineBtn" type="button">Ajouter un trajet</button>
        </div>

        <div class="card">
          <h2>Images</h2>
          <input id="imageUpload" type="file" accept="image/*" />
          <button id="uploadImageBtn" type="button">Ajouter image</button>
          <img id="uploadedPreview" alt="image ajoutée" style="display:none; width:100%; margin-top:10px;" />
        </div>

        <div class="card">
          <h2>PDF à joindre</h2>
          <input id="mergePdfUpload" type="file" accept="application/pdf" multiple />
          <button id="uploadPdfBtn" type="button">Ajouter PDF (page suivante)</button>
          <div id="mergePdfList" class="attachment-list"></div>
        </div>
      </aside>

      <main class="main-panel">
        <section class="toolbar">
          <button id="previewBtn" type="button">Aperçu</button>
          <button id="generateBtn" type="button" class="primary">Générer PDF</button>
          <button id="saveBtn" type="button">Enregistrer le document</button>
          <button id="downloadBtn" type="button">Télécharger</button>
          <button id="saveTemplateBtn" type="button">Enregistrer template</button>
        </section>

        <div class="template-toolbar card">
          <label>Template existant
            <select id="templateSelect"></select>
          </label>
          <button id="loadTemplateBtn" type="button">Charger</button>
        </div>

        <div class="doc-toolbar card">
          <label>Documents enregistrés
            <select id="documentSelect"></select>
          </label>
          <button id="loadDocumentBtn" type="button">Ouvrir</button>
        </div>

        <div class="editor-grid">
          <div class="template-panel card">
            <h2>Template HTML</h2>
            <textarea id="templateHtml" rows="28"></textarea>
          </div>

          <div class="preview-panel card">
            <h2>Visualisation</h2>
            <iframe id="previewFrame" title="Aperçu du document"></iframe>
          </div>
        </div>

        <div class="mail-panel card">
          <h2>Envoi de mail</h2>
          <div class="mail-form">
            <label>Destinataire
              <select id="recipientSelect"></select>
            </label>
            <label>Objet
              <input id="mailSubject" value="Ordre de mission" />
            </label>
            <label>Corps du mail
              <textarea id="mailBody" rows="6">Bonjour, veuillez trouver ci-joint l’ordre de mission.</textarea>
            </label>
            <button id="sendMailBtn" type="button" class="primary">Envoyer le mail</button>
          </div>
        </div>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
